<div class="chat-container">
  <div class="chat-header">
    <h2>Chat de Recomendaciones</h2>
    <div class="connection-status" [class.connected]="isConnected" [class.disconnected]="!isConnected">
      <span class="status-dot"></span>
      {{ isConnected ? 'Conectado' : 'Desconectado' }}
    </div>
  </div>

  <div class="chat-messages" #messagesContainer>
    <div 
      *ngFor="let message of messages" 
      class="message" 
      [class.user-message]="message.isUser"
      [class.bot-message]="!message.isUser"
      [class.recommendation-message]="message.isRecommendation"
    >
      <div class="message-content">
        <div class="message-text">{{ message.content }}</div>
        
        <!-- Botón sutil para ver recomendaciones -->
        <div *ngIf="message.recommendations && message.recommendations.length > 0" class="recommendations-hint">
          <button (click)="toggleMessageRecommendations(message)" class="recommendations-toggle-btn">
            <i class="icon">{{ message.showRecommendations ? '📦' : '🎁' }}</i>
            {{ message.showRecommendations ? 'Ocultar recomendaciones' : 'Aquí tienes ' + message.recommendations.length + ' recomendaciones populares' }}
          </button>
          
          <!-- Recomendaciones expandibles -->
          <div *ngIf="message.showRecommendations" class="recommendations-grid-inline">
            <div 
              *ngFor="let rec of message.recommendations" 
              class="recommendation-card-inline"
            >
              <div class="recommendation-content-inline">
                <h5>{{ rec.nombre }}</h5>
                <p *ngIf="rec.descripcion" class="rec-description">{{ rec.descripcion }}</p>
                <div class="recommendation-price-inline">${{ rec.precio | number:'1.2-2' }}</div>
                <div *ngIf="rec.categoria" class="recommendation-category-inline">
                  <i class="category-icon">🍽️</i> {{ rec.categoria }}
                </div>
                
                <!-- Botones de acción -->
                <div class="recommendation-actions">
                  <button 
                    class="btn-mas-info" 
                    (click)="selectRecommendation(rec)"
                    title="Más información"
                  >
                    <i class="fas fa-info-circle"></i> Más Info
                  </button>
                  <button 
                    class="btn-agregar-carrito" 
                    (click)="abrirModalAgregar(rec)"
                    title="Agregar al carrito"
                  >
                    <i class="fas fa-shopping-cart"></i> Agregar
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="message-time">{{ message.timestamp | date:'short' }}</div>
      </div>
    </div>
    
    <div *ngIf="isLoading" class="message bot-message">
      <div class="message-content">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel de recomendaciones flotante removido - ahora inline en mensajes -->

  <div class="chat-input">
    <div class="input-container">
      <textarea
        [(ngModel)]="newMessage"
        (keypress)="onKeyPress($event)"
        placeholder="Escribe tu mensaje aquí..."
        [disabled]="isLoading"
        rows="2"
        class="message-input"
      ></textarea>
      <button 
        (click)="sendMessage()" 
        [disabled]="!newMessage.trim() || isLoading"
        class="send-button"
      >
        <i class="send-icon">📤</i>
      </button>
    </div>
  </div>

  <div class="chat-actions">
    <button (click)="loadChatHistory()" class="action-button">
      <i class="history-icon">📜</i>
      Historial
    </button>
    <button (click)="clearChat()" class="action-button">
      <i class="clear-icon">🗑️</i>
      Limpiar
    </button>
  </div>
</div>

<!-- Modal para agregar producto al carrito -->
<app-modal-agregar-producto
  [producto]="productoParaAgregar"
  [mostrar]="mostrarModalAgregar"
  (cerrar)="cerrarModalAgregar()"
  (agregar)="agregarProductoAlCarrito($event)"
></app-modal-agregar-producto>
